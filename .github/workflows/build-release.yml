name: Build and release

# Tag pushes (v*) build the APK, run the unit tests, and publish a
# GitHub Release with the APK attached. Manual workflow_dispatch builds
# the same signed release APK but uploads it ONLY as a workflow
# artifact — no tag, no GitHub Release, nothing published (used for
# sideloading test builds, e.g. Nova validation, without shipping).
# With the dev_build input set, the dispatch additionally replaces the
# assets on the rolling `dev-latest` prerelease (the DEV / CANDIDATE
# in-app channel's feed) — still no tag, no new release.
# The sandbox cannot run Gradle (daemon TCP handshake stalls), so CI is
# the build machine.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dev_build:
        description: "Publish this build to the rolling dev-latest prerelease (DEV / CANDIDATE channel)"
        type: boolean
        default: false
        required: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive release metadata from tag
        # Release naming is derived from the tag (v<version>) and the
        # app's versionName — never hardcoded — so a U2/U2.1 tag can
        # never publish an APK still named U1.2. For tag builds the tag
        # MUST match versionName, because the in-app self-updater
        # compares the release tag against the installed versionName;
        # a mismatch would silently disable update notifications.
        # Manual dispatches build from versionName directly.
        run: |
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            if [ "$VN" != "$VERSION" ]; then
              echo "Tag version $VERSION != versionName $VN in app/build.gradle.kts"
              exit 1
            fi
          else
            VERSION="$VN"
            TAG="v$VN"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK_NAME=crystal-nova-manager-${VERSION}.apk" >> "$GITHUB_ENV"
          echo "Release: $TAG -> $APK_NAME"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # ubuntu-latest runners ship a preinstalled SDK; the setup-android
        # action fails on the obsolete "tools" package, so install the
        # needed packages directly.
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Run unit tests
        # The hardware-behavior D-pad test (NovaFocusBringsIntoViewTest)
        # cannot pass under Robolectric; it runs as a separate
        # non-gating job below. Every ordinary unit test still gates
        # every build — dev/candidate and stable.
        run: ./gradlew testDebugUnitTest --no-daemon -Pcnm.excludeHardwareTests

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 7

      - name: Decode signing keystore
        # The persistent release key lives only in GitHub Secrets. Every
        # release build is signed with it so the in-app updater's installs
        # pass Android's same-certificate check.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/cnm-release.keystore
          echo "CNM_KEYSTORE_PATH=/tmp/cnm-release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          CNM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CNM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CNM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "${{ env.APK_NAME }}"
          ls -la "${{ env.APK_NAME }}"

      - name: Prepare dev channel assets
        # dev_build=true only: copy the signed release APK to the fixed
        # dev asset name and generate the manifest the DEV / CANDIDATE
        # in-app channel reads. Never creates a release or a tag — the
        # rolling `dev-latest` prerelease already exists.
        if: ${{ inputs.dev_build }}
        run: |
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VC=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          cp "${{ env.APK_NAME }}" crystal-nova-manager-dev.apk
          SHA=$(sha256sum crystal-nova-manager-dev.apk | awk '{print $1}')
          BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > manifest.json <<EOF
          {
            "versionName": "$VN",
            "versionCode": $VC,
            "apkSha256": "$SHA",
            "apkUrl": "https://github.com/ciaranf3308-star/crystal-nova-manager/releases/download/dev-latest/crystal-nova-manager-dev.apk",
            "commitSha": "$GITHUB_SHA",
            "builtAt": "$BUILT"
          }
          EOF
          cat manifest.json
          ls -la crystal-nova-manager-dev.apk manifest.json

      - name: Upload dev channel to dev-latest
        # Replaces the assets on the existing rolling prerelease.
        # --clobber overwrites the two assets in place; no release or
        # tag is ever created here.
        if: ${{ inputs.dev_build }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload --clobber dev-latest crystal-nova-manager-dev.apk manifest.json

      - name: Upload signed APK as artifact
        # On manual dispatch this is the ONLY delivery: no tag, no
        # GitHub Release, nothing published. The artifact APK is the
        # normal signed release build (io.crystalnova.manager), safe to
        # sideload over an existing install to test the upgrade path.
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Crystal Nova Manager ${{ env.RELEASE_VERSION }}
          files: ${{ env.APK_NAME }}
          body: |
            Crystal Nova Manager ${{ env.RELEASE_VERSION }}.

            - On launch it checks this repo's releases; when a newer build
              is out, an UPDATE APP button appears under the header.
            - UPDATE APP downloads the release APK and hands it to
              Android's system installer (one tap on its prompt).
            - On Android 8+, allow "install unknown apps" for Crystal Nova
              once, in Settings — the app guides you there.
            - No background checks, no accounts, no telemetry.

            No theme updater behaviour changed.

  hardware-behavior-test:
    # KNOWN-FAILING hardware-behavior test: physical Nova D-pad focus
    # scrolling cannot be proven under Robolectric (see the test's KDoc).
    # This job runs it visibly but never gates any release — dev or
    # stable. Real-device verification is the acceptance gate.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Run hardware-behavior D-pad test (non-gating)
        run: ./gradlew testDebugUnitTest --no-daemon --tests "io.crystalnova.manager.ui.NovaFocusBringsIntoViewTest"

      - name: Upload hardware test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 7
