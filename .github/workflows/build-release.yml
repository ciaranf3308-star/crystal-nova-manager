name: Build and release

# Tag pushes (v*) build the APK, run the unit tests, and publish a
# GitHub Release with the APK attached. The sandbox cannot run Gradle
# (daemon TCP handshake stalls), so CI is the build machine.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive release metadata from tag
        # Release naming is derived from the tag (v<version>) and the
        # app's versionName — never hardcoded — so a U2/U2.1 tag can
        # never publish an APK still named U1.2. For tag builds the tag
        # MUST match versionName, because the in-app self-updater
        # compares the release tag against the installed versionName;
        # a mismatch would silently disable update notifications.
        # Manual dispatches build from versionName directly.
        run: |
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            if [ "$VN" != "$VERSION" ]; then
              echo "Tag version $VERSION != versionName $VN in app/build.gradle.kts"
              exit 1
            fi
          else
            VERSION="$VN"
            TAG="v$VN"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK_NAME=crystal-nova-manager-${VERSION}.apk" >> "$GITHUB_ENV"
          echo "Release: $TAG -> $APK_NAME"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # ubuntu-latest runners ship a preinstalled SDK; the setup-android
        # action fails on the obsolete "tools" package, so install the
        # needed packages directly.
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Decode signing keystore
        # The persistent release key lives only in GitHub Secrets. Every
        # release build is signed with it so the in-app updater's installs
        # pass Android's same-certificate check.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/cnm-release.keystore
          echo "CNM_KEYSTORE_PATH=/tmp/cnm-release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          CNM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CNM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CNM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "${{ env.APK_NAME }}"
          ls -la "${{ env.APK_NAME }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Crystal Nova Manager ${{ env.RELEASE_VERSION }}
          files: ${{ env.APK_NAME }}
          body: |
            Crystal Nova Manager ${{ env.RELEASE_VERSION }}.

            - On launch it checks this repo's releases; when a newer build
              is out, an UPDATE APP button appears under the header.
            - UPDATE APP downloads the release APK and hands it to
              Android's system installer (one tap on its prompt).
            - On Android 8+, allow "install unknown apps" for Crystal Nova
              once, in Settings — the app guides you there.
            - No background checks, no accounts, no telemetry.

            No theme updater behaviour changed.
